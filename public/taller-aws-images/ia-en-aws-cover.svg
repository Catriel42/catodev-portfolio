<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#231A10" />
      <stop offset="60%" stop-color="#0E121A" />
      <stop offset="100%" stop-color="#080A0E" />
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9900" />
      <stop offset="100%" stop-color="#00D2FF" />
    </linearGradient>
    <linearGradient id="boxGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 153, 0, 0.15)" />
      <stop offset="100%" stop-color="rgba(0, 210, 255, 0.05)" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />

  <!-- Subtle Dot Grid -->
  <g fill="rgba(255, 255, 255, 0.08)">
    <circle cx="50" cy="50" r="1.5" /><circle cx="150" cy="50" r="1.5" /><circle cx="250" cy="50" r="1.5" /><circle cx="350" cy="50" r="1.5" /><circle cx="450" cy="50" r="1.5" /><circle cx="550" cy="50" r="1.5" /><circle cx="650" cy="50" r="1.5" /><circle cx="750" cy="50" r="1.5" />
    <circle cx="50" cy="150" r="1.5" /><circle cx="150" cy="150" r="1.5" /><circle cx="250" cy="150" r="1.5" /><circle cx="350" cy="150" r="1.5" /><circle cx="450" cy="150" r="1.5" /><circle cx="550" cy="150" r="1.5" /><circle cx="650" cy="150" r="1.5" /><circle cx="750" cy="150" r="1.5" />
    <circle cx="50" cy="250" r="1.5" /><circle cx="150" cy="250" r="1.5" /><circle cx="250" cy="250" r="1.5" /><circle cx="350" cy="250" r="1.5" /><circle cx="450" cy="250" r="1.5" /><circle cx="550" cy="250" r="1.5" /><circle cx="650" cy="250" r="1.5" /><circle cx="750" cy="250" r="1.5" />
    <circle cx="50" cy="350" r="1.5" /><circle cx="150" cy="350" r="1.5" /><circle cx="250" cy="350" r="1.5" /><circle cx="350" cy="350" r="1.5" /><circle cx="450" cy="350" r="1.5" /><circle cx="550" cy="350" r="1.5" /><circle cx="650" cy="350" r="1.5" /><circle cx="750" cy="350" r="1.5" />
  </g>

  <!-- Card container in center -->
  <rect x="70" y="60" width="660" height="330" rx="20" fill="url(#boxGlow)" stroke="rgba(255, 153, 0, 0.35)" stroke-width="1.5" />

  <!-- Badge -->
  <rect x="105" y="95" width="230" height="30" rx="15" fill="rgba(255, 153, 0, 0.18)" stroke="#FF9900" stroke-width="1" />
  <text x="220" y="115" text-anchor="middle" fill="#FF9900" font-size="12" font-weight="700" font-family="monospace">AWS AI USER GROUP BOLIVIA</text>

  <!-- Title -->
  <text x="105" y="185" fill="#FFFFFF" font-size="44" font-weight="900" font-family="system-ui, -apple-system, sans-serif" letter-spacing="-1">IA en AWS</text>
  <text x="105" y="235" fill="url(#textGrad)" font-size="28" font-weight="700" font-family="system-ui, -apple-system, sans-serif">De las ideas a los agentes en producción</text>

  <!-- Tags pill row -->
  <rect x="105" y="275" width="130" height="28" rx="6" fill="#151A24" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
  <text x="170" y="293" text-anchor="middle" fill="#9CA3AF" font-size="11" font-weight="600" font-family="monospace">Bedrock (LLMs)</text>

  <rect x="250" y="275" width="130" height="28" rx="6" fill="#151A24" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
  <text x="315" y="293" text-anchor="middle" fill="#9CA3AF" font-size="11" font-weight="600" font-family="monospace">Strands Agents</text>

  <rect x="395" y="275" width="130" height="28" rx="6" fill="#151A24" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
  <text x="460" y="293" text-anchor="middle" fill="#9CA3AF" font-size="11" font-weight="600" font-family="monospace">AgentCore (microVMs)</text>

  <!-- Bottom CTA badge -->
  <rect x="105" y="330" width="190" height="34" rx="8" fill="#FF9900" />
  <text x="200" y="352" text-anchor="middle" fill="#0B0E14" font-size="12" font-weight="800" font-family="system-ui, sans-serif">VER SLIDE DECK →</text>

  <!-- Right Decorative Vector Emblem -->
  <circle cx="620" cy="225" r="70" fill="none" stroke="rgba(255, 153, 0, 0.25)" stroke-width="2" stroke-dasharray="6 6" />
  <circle cx="620" cy="225" r="48" fill="rgba(0, 210, 255, 0.08)" stroke="#00D2FF" stroke-width="2" />
  <text x="620" y="233" text-anchor="middle" fill="#00D2FF" font-size="24" font-weight="900" font-family="monospace">17</text>
  <text x="620" y="252" text-anchor="middle" fill="#9CA3AF" font-size="10" font-weight="700" font-family="monospace">SLIDES</text>
</svg>
